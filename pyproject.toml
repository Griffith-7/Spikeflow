[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spikeflow"
version = "0.1.0"
description = "High-performance Spiking Neural Network library — train at transformer speed, deploy with binary spike efficiency"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "SpikeFlow Contributors"}
]
keywords = [
    "spiking-neural-network",
    "snn",
    "neuromorphic",
    "deep-learning",
    "pytorch",
    "edge-ai",
    "binary-neural-network",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch>=2.1.0",
]

[project.optional-dependencies]
neuromorphic = ["tonic>=1.3.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/Griffith-7/Spikeflow"
Documentation = "https://spikeflow.readthedocs.io"
Repository = "https://github.com/Griffith-7/Spikeflow"
Issues = "https://github.com/Griffith-7/Spikeflow/issues"

[tool.setuptools.packages.find]
include = ["spikeflow*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N802", "N806", "N812"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
